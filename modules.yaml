# modules.yaml - makeshift Bazel

libraries:
  common_types:
    description: "Common SystemVerilog types and definitions"
    sources:
      - "rtl/common/example_typedef.sv"

  common_interfaces:
    description: "Common SystemVerilog interfaces"
    sources:
      - "rtl/common/example_if.sv"

  all_common:
    description: "All common files combined"
    deps:
      - "common_types"
      - "common_interfaces"

modules:
  example_using_typedef:
    description: "Example module using typedef"
    sources:
      - "rtl/example/example_using_typedef.sv"
    deps:
      - "common_types"
    toplevel: "example_using_typedef"

  example_using_interface:
    description: "Example module using interface"
    sources:
      - "rtl/example/example_using_interface.sv"
    deps:
      - "common_interfaces"
    toplevel: "example_using_interface"

tests:
  test_example_using_typedef:
    description: "Test typedef-based example"
    target_module: "example_using_typedef"
    testbench:
      wrapper: "tb/example/example_using_typedef_tb.sv"
      toplevel: "example_using_typedef_tb"
      cocotb_module: "tb.example.test_example_using_typedef"
    test_variants:
      - name: "basic"
        defines:
          TEST_BASIC: 1

  test_example_using_interface:
    description: "Test interface-based example"
    target_module: "example_using_interface"
    testbench:
      wrapper: "tb/example/example_using_interface_tb.sv"
      toplevel: "example_using_interface_tb"
      cocotb_module: "tb.example.test_example_using_interface"
    test_variants:
      - name: "basic"
        defines:
          TEST_BASIC: 1

test_suites:
  unit_tests:
    description: "All unit tests"
    tests:
      - "test_example_using_typedef"
      - "test_example_using_interface"

config:
  simulator: "verilator"
  default_timescale: "1ns/1ps"
  default_language: "SystemVerilog"

  verilator:
    flags:
      - "--trace"
      - "--trace-structs"
      - "--trace-params"
      - "-CFLAGS"
      - "-std=c++17"
      - "-LDFLAGS"
      - "-std=c++17"

  vcd:
    enable: true
    filename: "dump.vcd"
    depth: 99

  global_defines:
    SIMULATION: 1