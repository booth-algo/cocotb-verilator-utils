[tox]
skipsdist = True
envlist = py311

[testenv]
setenv =
    SIM = verilator
    TIMEUNIT = "1ns"
    TIMEPREC = "100ps"
    PYTHONPATH = {toxinidir}

deps =
    pytest
    pytest-xdist
    cocotb-test >= 0.2.0
    cocotb >= 1.8.0
    PyYAML >= 5.4.1

# Run all tests
commands = pytest tb/example/ -v {posargs}

# Run specific module test using YAML config
# Usage: tox -e test-module -- --test=test_example_using_typedef
[testenv:test-module]
setenv =
    SIM = verilator
    PYTHONPATH = {toxinidir}
deps =
    pytest
    PyYAML
commands = python -m tb.common.cli {posargs}

# List all available targets from YAML
[testenv:list-targets]
commands = python -c "from tb.common.module_runner import list_available_targets; list_available_targets()"

[pytest]
testpaths = tb
addopts = --import-mode prepend
markers =
    basic: Basic functionality tests